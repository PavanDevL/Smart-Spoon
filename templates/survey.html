{% extends "base.html" %}
{% block title %}Survey Insights{% endblock %}

{% block content %}
<div class="container mt-5">

    <!-- Dark Mode Toggle Button -->
    <div class="text-end mb-3">
        <button id="toggleDarkMode" class="btn btn-dark">Toggle Dark Mode</button>
    </div>

    <!-- Spinner -->
    <div id="loadingSpinner" class="text-center my-5">
        <div class="spinner-border text-primary" role="status" style="width: 4rem; height: 4rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
        <h5 class="mt-2">Loading Survey Insights...</h5>
    </div>

    <!-- Charts Content -->
    <div id="chartsContent" style="display: none;">
        <h2 class="text-center mb-4">Survey Insights</h2>

        <div class="row">
            <div class="col-md-6 mb-4 animate__animated animate__fadeInLeft">
                <canvas id="pieChart"></canvas>
            </div>
            <div class="col-md-6 mb-4 animate__animated animate__fadeInRight">
                <canvas id="barChart"></canvas>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12 mb-4 animate__animated animate__fadeInUp">
                <canvas id="lineChart"></canvas>
            </div>
        </div>

    </div>

</div>
{% endblock %}

{% block scripts %}
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Animate.css for animations -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

<script>
// Fetch data from backend
fetch('/get_survey_data')
    .then(response => response.json())
    .then(data => {
        // Hide spinner, show charts
        document.getElementById('loadingSpinner').style.display = 'none';
        document.getElementById('chartsContent').style.display = 'block';

        // Pie Chart
        const pieCtx = document.getElementById('pieChart').getContext('2d');
        new Chart(pieCtx, {
            type: 'pie',
            data: {
                labels: data.pie.labels,
                datasets: [{
                    data: data.pie.data,
                    backgroundColor: ['#28a745', '#ffc107', '#dc3545','#007bff','#17a2b8'],
                }]
            },
            options: {
                animation: {
                    duration: 2000,
                    easing: 'easeInOutBounce'
                }
            }
        });

        // Bar Chart
        const barCtx = document.getElementById('barChart').getContext('2d');
        new Chart(barCtx, {
            type: 'bar',
            data: {
                labels: data.bar.labels,
                datasets: [{
                    label: 'Frequency of Salt Usage in Indian Dishes (Dal/Gojju/Palya)',
                    data: data.bar.data,
                    backgroundColor: '#007bff'
                }]
            },
            options: {
                animation: {
                    duration: 2000,
                    easing: 'easeOutElastic'
                }
            }
        });

        // Line Chart
        const lineCtx = document.getElementById('lineChart').getContext('2d');
        new Chart(lineCtx, {
            type: 'line',
            data: {
                labels: data.line.labels,
                datasets: [{
                    label: 'Monthly Satisfaction Score',
                    data: data.line.data,
                    fill: false,
                    borderColor: '#17a2b8',
                    tension: 0.4
                }]
            },
            options: {
                animation: {
                    duration: 2000,
                    easing: 'easeInOutQuart'
                }
            }
        });
    })
    .catch(error => {
        console.error('Error fetching survey data:', error);
        document.getElementById('loadingSpinner').innerHTML = `<h5 class="text-danger">Failed to load data. Please try again.</h5>`;
    });

// Dark Mode Toggle
document.getElementById('toggleDarkMode').addEventListener('click', function() {
    document.body.classList.toggle('dark-mode');
});
</script>

<!-- Custom Dark Mode CSS -->
<style>
/* Dark Mode Styles */
.dark-mode {
    background-color: #121212;
    color: #ffffff;
}

.dark-mode .container {
    background-color: #1e1e1e;
    border-radius: 10px;
    padding: 20px;
}

.dark-mode canvas {
    background-color: #2c2c2c;
    border-radius: 10px;
}
</style>
{% endblock %}
