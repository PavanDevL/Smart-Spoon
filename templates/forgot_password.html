{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="text-center mb-4">Forgot Password</h2>
        <form id="forgotPasswordForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input required type="text" class="form-control" id="username" name="username">
            </div>
            <div class="mb-3">
                <label for="security_answer" class="form-label">Your Favorite Color?</label>
                <input required type="text" class="form-control" id="security_answer" name="security_answer">
            </div>
            <div class="mb-3">
                <label for="new_password" class="form-label">New Password</label>
                <input required type="password" class="form-control" id="new_password" name="new_password">
            </div>
            <button type="submit" class="btn btn-warning w-100">Reset Password</button>
        </form>
        <p class="mt-3 text-center"><a href="/login">Back to login</a></p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
    e.preventDefault();

    fetch('/forgot_password', {
        method: 'POST',
        body: new FormData(this)
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'success') {
            Swal.fire({
                icon: 'success',
                title: 'Password Reset!',
                text: data.message,
                timer: 1500,
                showConfirmButton: false
            }).then(() => window.location.href = '/login');
        } else {
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: data.message
            });
        }
    });
});
</script>
{% endblock %}
