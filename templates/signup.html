{% extends "base.html" %}
{% block title %}Signup{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="text-center mb-4">Signup</h2>
        <form id="signupForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input required type="text" class="form-control" id="username" name="username">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input required type="password" class="form-control" id="password" name="password">
            </div>
            <div class="mb-3">
                <label for="security_answer" class="form-label">Your Favorite Color? (for password reset)</label>
                <input required type="text" class="form-control" id="security_answer" name="security_answer">
            </div>
            <button type="submit" class="btn btn-success w-100">Signup</button>
        </form>
        <p class="mt-3 text-center">Already have an account? <a href="/login">Login here</a></p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('signupForm').addEventListener('submit', function(e) {
    e.preventDefault();

    fetch('/signup', {
        method: 'POST',
        body: new FormData(this)
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'success') {
            Swal.fire({
                icon: 'success',
                title: 'Account Created!',
                text: data.message,
                timer: 1500,
                showConfirmButton: false
            }).then(() => window.location.href = '/login');
        } else {
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: data.message
            });
        }
    });
});
</script>
{% endblock %}
